[build]
  publish = "."

# Netlify front page: serve the full project showcase at the site root.
[[redirects]]
  from = "/"
  to = "/portfolio_showcase.html"
  status = 200
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/portfolio_showcase.html"
  status = 200

[[redirects]]
  from = "/showcase"
  to = "/portfolio_showcase.html"
  status = 200

# Clean project routes. Use verified Netlify/live deployments where available.
[[redirects]]
  from = "/afrimoney"
  to = "https://afrimoney.netlify.app/"
  status = 301
  force = true

[[redirects]]
  from = "/afrimoney/*"
